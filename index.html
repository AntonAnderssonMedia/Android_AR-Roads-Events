          // ============================================================================
          // Since roads are children of the plane, they automatically follow the plane's
          // position and rotation. No need to update them manually when the plane moves.
          // 
          // Note: If the roadsGroup already exists (from a previous call), we don't need
          // to do anything - the roads are already in the scene and will move with the plane.
        }

        // Remove road meshes from scene
        function removeRoadsFromPlane() {
          for (const roadMesh of roadMeshes) {
            scene.remove(roadMesh);
          }
        }

        // Toggle placement mode (show/hide reticle and enable/disable tap placement)
        placementToggleButton.addEventListener("click", () => {
          blockNextSelect = true;
          placementMode = !placementMode;
          placementToggleButton.textContent = placementMode ? "Placement: ON" : "Placement: OFF";
          instructionsEl.textContent = placementMode
            ? "Placement mode: ON – move to find a surface, then tap to place a plane."
            : "Placement mode: OFF – walk around and observe the plane or explore dates.";

          if (!placementMode && reticle) {
            reticle.visible = false;
          }
        });

        enterARButton.addEventListener("click", () => {
          startAR().catch((err) => {
            console.error(err);
            alert("Failed to start AR: " + err.message);
          });
        });

        // ============================================================================
        // DATE FILTERING UI FUNCTIONS
        // ============================================================================
        // These functions handle the date selection UI, allowing users to navigate through
        // available dates and filter which events are displayed.
        
        // ============================================================================
        // UPDATE DATE LABEL
        // ============================================================================
        // Updates the visible date label in the UI to show the currently selected date.
        
        function updateEventDateLabel() {
          // Get the label element from the DOM
          const labelEl = document.getElementById("event-date-label");
          if (!labelEl) return;  // Safety check (element might not exist yet)
          
          // Set the label text to the active date, or "No date" if none is selected
          labelEl.textContent = activeEventDate || "No date";
        }

        // ============================================================================
        // POPULATE DATE FILTER
        // ============================================================================
        // Initializes the date filter with available dates from the loaded event data.
        // Called once when events are loaded.
        
        function populateEventDateFilter(dates) {
          // Store the available dates (sorted array of unique dates)
          availableEventDates = dates || [];
          
          // If no date is currently selected, select the first available date
          if (!activeEventDate && availableEventDates.length > 0) {
            activeEventDate = availableEventDates[0];
          }
          
          // Update the UI label to show the selected date
          updateEventDateLabel();
        }

        // ============================================================================
        // DATE NAVIGATION UI SETUP
        // ============================================================================
        // Get references to the date navigation UI elements (prev/next buttons and label).
        // Set up event listeners to prevent XR select events when clicking these elements.
        
        const eventDatePrev = document.getElementById("event-date-prev");
        const eventDateNext = document.getElementById("event-date-next");
        const eventDateLabel = document.getElementById("event-date-label");

        // Collect all date UI elements into an array (filter out nulls in case elements don't exist)
        const dateUiElements = [eventDatePrev, eventDateNext, eventDateLabel].filter(Boolean);
        
        // For each UI element, add event listeners to prevent XR select events
        dateUiElements.forEach((el) => {
          // Listen for multiple event types (pointer, mouse, touch, click) to cover all devices
          ["pointerdown", "mousedown", "touchstart", "click"].forEach((evt) => {
            el.addEventListener(evt, () => {
              // Set blockNextSelect to true so the XR select handler ignores the next select event
              // This prevents tapping the date UI from moving the plane
          blockNextSelect = true;
            });
          });
        });

        // ============================================================================
        // CHANGE ACTIVE DATE
        // ============================================================================
        // Changes the currently selected date, cycling through available dates.
        // Called when user clicks prev/next buttons.
        //
        // Input: direction = -1 (previous) or +1 (next)
        // Effect: Updates activeEventDate, UI label, and rebuilds event markers
        
        function changeActiveDate(direction) {
          // Safety check: need at least one available date
          if (!availableEventDates.length) return;
          
          // Find the index of the currently active date
          let idx = availableEventDates.indexOf(activeEventDate);
          
          // If date not found (shouldn't happen), default to first date
          if (idx === -1) idx = 0;
          
          // Calculate new index with wrapping (circular navigation)
          // direction = -1 (prev) or +1 (next)
          // Adding availableEventDates.length ensures positive result before modulo
          idx = (idx + direction + availableEventDates.length) % availableEventDates.length;
          // Example: If at index 0 and direction = -1:
          //   (0 + (-1) + 5) % 5 = 4 % 5 = 4 (wraps to last date)
          
          // Update the active date
          activeEventDate = availableEventDates[idx];
          
          // Update the UI label to show the new date
          updateEventDateLabel();
          
          // Rebuild event markers for the new date
          // This disposes old markers and creates new ones for the selected date
          rebuildEventMarkersForActiveDate();
        }

        if (eventDatePrev) {
          eventDatePrev.addEventListener("click", () => {
          blockNextSelect = true;
            changeActiveDate(-1);
        });
        }

        if (eventDateNext) {
          eventDateNext.addEventListener("click", () => {
          blockNextSelect = true;
            changeActiveDate(1);
          });
        }

        // (Road rotation controls removed – geometry/roads are now controlled purely by placement and data)
      })(); // End of init function
    </script>
  </body>
</html>
